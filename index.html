                <h3 class="flex-grow-1">Chapter 1</h3>
                <button class="btn btn-outline-info btn-success text-white mx-2" onclick="Edit(this)">Edit</button>

<script src="../bootstrap/css/js/bootstrap.bundle.min.js"></script>

<!-- My JavaScript -->
<script>
    // main division tag
    const mainDiv = document.getElementById('mainDiv').children[0];
    // extract text from user input
    const textof = document.getElementById('inputPassword5');

    // click button 
    const btn = textof.nextElementSibling;
    btn.addEventListener('click', Add);
    // create element function 
    function Add() {
        const toCreate = document.createElement('li');
        toCreate.innerHTML = `<h3 class="flex-grow-1">${textof.value}</h3>
                <button class="btn btn-outline-info btn-success text-white mx-2"  onclick="Edit(this)">Edit</button>
                <button class="btn btn-outline-warning btn-danger text-white" onclick="remove(this)">Remove</button>`;
        toCreate.className = "list-group-item d-flex justify-content-between";
        mainDiv.appendChild(toCreate);
        const ul = document.getElementById('ul');
        if (ul.children[0].getAttribute('data-first') == 'first') {
            ul.children[0].remove();
        }
    }
    // remove fucntoin 
    function remove(elem) {
        elem.parentElement.remove();

        const ul = document.getElementById('ul');

        if (ul.children.length <= 0) {
            // console.log(ul.Element.length)
            const create = document.createElement('h3');
            create.className = 'flex-grow-1';
            create.textContent = "Nothing is here. please add chapter!!";
            create.setAttribute('data-first', 'first');
            ul.appendChild(create);

        }
    }

    // Edit chapter Name
    function Edit(element) {
        if (element.textContent == 'Done') {
            element.textContent = 'Edit';

            const editContent = element.previousElementSibling.value;
            // create H3
            const h3 = document.createElement('h3');
            h3.classList.add('flex-grow-1');
            h3.textContent = editContent;
            element.parentElement.replaceChild(h3, element.previousElementSibling);

        } else {
            element.textContent = 'Done';
            const chaptername = element.previousElementSibling;
            console.log(chaptername)
            const parent = element.parentElement;
            const create = document.createElement('input');
            create.type = 'text';
            // create.classList.add('form-control');
            create.className = 'form-control flex-grow-1'
            create.placeholder = 'Chapter Name';
            create.value = chaptername.innerText;
            parent.replaceChild(create, chaptername)
        }
    }
</script>
